name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS / Swift 6.x
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache .build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-swift6-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-swift6-
      - name: Build
        run: swift build -c debug
      - name: Test
        run: swift test --parallel
      - name: Strict concurrency (test + warnings-as-errors)
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

  linux:
    name: Linux / swift:6.0-jammy
    runs-on: ubuntu-22.04
    container:
      image: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Cache .build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-swift6-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-swift6-
      - name: Build
        run: swift build -c debug
      - name: Test
        run: swift test --parallel
      - name: Strict concurrency (test + warnings-as-errors)
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

  apple-platforms:
    name: ${{ matrix.platform }} compile-only
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: "generic/platform=iOS"
          - platform: tvOS
            destination: "generic/platform=tvOS"
          - platform: watchOS
            destination: "generic/platform=watchOS"
          - platform: visionOS
            destination: "generic/platform=visionOS"
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Compile
        run: xcodebuild build -scheme Fuse -destination '${{ matrix.destination }}' -skipPackagePluginValidation
