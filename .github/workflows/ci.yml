name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS / Swift ${{ matrix.swift }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "5.10"
            xcode: "15.4"
          - swift: "6.x"
            xcode: "latest-stable"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Cache .build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ matrix.swift }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ matrix.swift }}-
      - name: Build
        run: swift build -c debug
      - name: Test
        run: swift test --parallel
      - name: Strict concurrency (test + warnings-as-errors)
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

  linux:
    name: Linux / ${{ matrix.image }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - "swift:5.10-jammy"
          - "swift:6.0-jammy"
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache .build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ matrix.image }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ matrix.image }}-
      - name: Build
        run: swift build -c debug
      - name: Test
        run: swift test --parallel
      - name: Strict concurrency (test + warnings-as-errors)
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

  apple-platforms:
    name: ${{ matrix.platform }} compile-only
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: "generic/platform=iOS"
          - platform: tvOS
            destination: "generic/platform=tvOS"
          - platform: watchOS
            destination: "generic/platform=watchOS"
          - platform: visionOS
            destination: "generic/platform=visionOS"
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Compile
        run: xcodebuild build -scheme Fuse -destination '${{ matrix.destination }}' -skipPackagePluginValidation
